apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
// R8 ativo: minifica/ofusca o dex e habilita shrinkResources. O Play Console
// acusava "Otimização: Baixa" com isso desligado. Mudança aqui exige repetir
// o smoke test de release (docs/mobile-hardening.md §6) — R8 quebra em
// runtime (reflection), nunca em build.
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // namespace = pacote das classes geradas (R, BuildConfig) — segue o das
    // classes Java existentes. O applicationId é o identificador na Play Store
    // e pode ser diferente; é ele que NÃO pode mudar após a 1ª publicação.
    namespace "com.caloria"
    defaultConfig {
        applicationId "br.com.caloriaoficial.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // O versionCode é QUEIMADO assim que o Play aceita o upload — mesmo que
        // a versão nunca seja lançada e mesmo que você a descarte. Reenviar um
        // número já usado faz o Play ignorar o arquivo em silêncio: a versão fica
        // sem pacote e o console acusa "não adiciona nem remove pacotes de apps"
        // + "não permite que usuários existentes atualizem".
        // Conferir os números já gastos em: Versão > Explorador de pacotes de apps.
        // Para subir sem editar este arquivo:
        //   ./gradlew bundleRelease -PcaloriaVersionCode=5
        versionCode (project.findProperty('caloriaVersionCode') ?: 5) as Integer
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Assinatura de RELEASE. As credenciais vêm de ~/.gradle/gradle.properties
        // (fora do repositório) — nunca commitar keystore nem senha.
        // O build só é assinado se as 4 propriedades existirem; caso contrário
        // o Gradle falha explicitamente em vez de gerar um artefato inválido.
        release {
            if (project.hasProperty('CALORIA_UPLOAD_STORE_FILE')) {
                storeFile file(CALORIA_UPLOAD_STORE_FILE)
                storePassword CALORIA_UPLOAD_STORE_PASSWORD
                keyAlias CALORIA_UPLOAD_KEY_ALIAS
                keyPassword CALORIA_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // A Play Store REJEITA artefatos assinados com o certificado de debug.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// O throw em resolveBaseUrl (api.ts) já barra o app SEM API_BASE_URL — mas só
// no device, na abertura, sem UI nenhuma. Este task antecipa a falha para a
// máquina de build: se app/.env não tiver uma linha ATIVA (não comentada) de
// API_BASE_URL com valor https://, o bundleRelease para aqui, com mensagem
// acionável, em vez de gerar um .aab que morre na inicialização.
// Só se aplica ao release: dev usa http/localhost legitimamente.
tasks.register("verifyReleaseApiBaseUrl") {
    doLast {
        def envFile = file("${rootProject.projectDir}/../.env")
        def hasValidUrl = false
        if (envFile.exists()) {
            envFile.eachLine { line ->
                def trimmed = line.trim()
                if (trimmed.startsWith("API_BASE_URL=") && trimmed.contains("https://")) {
                    hasValidUrl = true
                }
            }
        }
        if (!hasValidUrl) {
            throw new GradleException(
                "app/.env sem API_BASE_URL ativo (https://...) — obrigatório para build de " +
                "release. Descomente/preencha API_BASE_URL=https://SEU-DEPLOY.vercel.app/api " +
                "em app/.env antes de rodar bundleRelease."
            )
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == "createBundleReleaseJsAndAssets" }.configureEach {
        dependsOn "verifyReleaseApiBaseUrl"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
