buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        // compileSdk precisa ser >= targetSdk. O AGP do RN 0.85 (8.12.0) já é
        // testado até compileSdk 36, então o aviso "tested up to compileSdk = 35"
        // que existia no RN 0.77 deixou de aparecer. Continua valendo: NÃO
        // suprimir avisos com android.suppressUnsupportedCompileSdk sem
        // revalidar o release.
        compileSdkVersion = 36
        // A Play Store exige que o targetSdk esteja no máximo 1 ano atrás da
        // versão mais recente do Android. Em 08/2026 isso significa API 36
        // (Android 16) — com 35 o upload é recusado na validação da versão.
        // Confirmar a exigência vigente no Play Console: essa régua se move.
        targetSdkVersion = 36
        // NDK r27+ é o que alinha a páginas de 16 KB as libs compiladas AQUI
        // (appmodules, rnscreens, codegen). As pré-compiladas vêm alinhadas dos
        // AARs do RN 0.77+. Baixar o r26 daqui reintroduz a recusa na Play —
        // ver docs/mobile-hardening.md item 8.
        ndkVersion = "27.1.12297006"
        // Kotlin 2.1.20 é o do template do RN 0.85 e a MESMA versão que o
        // react-native-gradle-plugin carrega no classpath (libs.versions.toml).
        // Bibliotecas autolinkadas leem este ext (screens, safe-area-context,
        // async-storage): deixar 2.0.21 aqui faz o compilador divergir do
        // plugin e o build quebra.
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Sem versão: quem manda é o react-native-gradle-plugin (RN 0.85 → AGP 8.12.0, KGP 2.1.20).
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
