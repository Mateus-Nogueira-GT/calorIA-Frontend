buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        // compileSdk precisa ser >= targetSdk. O AGP fixado pelo RN 0.77 (8.7.x)
        // ainda avisa "tested up to compileSdk = 35" a cada build — o aviso é
        // esperado e foi deixado à vista de propósito: só some com AGP >= 8.9,
        // que virá num upgrade futuro do RN. NÃO suprimir com
        // android.suppressUnsupportedCompileSdk sem revalidar o release.
        compileSdkVersion = 36
        // A Play Store exige que o targetSdk esteja no máximo 1 ano atrás da
        // versão mais recente do Android. Em 08/2026 isso significa API 36
        // (Android 16) — com 35 o upload é recusado na validação da versão.
        // Confirmar a exigência vigente no Play Console: essa régua se move.
        targetSdkVersion = 36
        // NDK r27+ é o que alinha a páginas de 16 KB as libs compiladas AQUI
        // (appmodules, rnscreens, codegen). As pré-compiladas vêm alinhadas dos
        // AARs do RN 0.77+. Baixar o r26 daqui reintroduz a recusa na Play —
        // ver docs/mobile-hardening.md item 8.
        ndkVersion = "27.1.12297006"
        // Kotlin 2.0.21 é o do template do RN 0.77 (a trava em 1.9.x era do
        // react-native-gradle-plugin do RN 0.76). O AsyncStorage permanece na
        // série 2.x por escolha — a API é idêntica à 3.x —, não mais por
        // incompatibilidade de Kotlin.
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Sem versão: quem manda é o react-native-gradle-plugin (RN 0.76 → 1.9.x).
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
