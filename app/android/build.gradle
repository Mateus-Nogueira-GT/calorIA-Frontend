buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        // compileSdk precisa ser >= targetSdk. O AGP 8.6 (fixado pelo RN 0.76)
        // avisa "tested up to compileSdk = 35" a cada build — o aviso é
        // esperado e foi deixado à vista de propósito: ele some quando o RN
        // for atualizado para uma versão com AGP mais novo. NÃO suprimir com
        // android.suppressUnsupportedCompileSdk sem revalidar o release.
        compileSdkVersion = 36
        // A Play Store exige que o targetSdk esteja no máximo 1 ano atrás da
        // versão mais recente do Android. Em 08/2026 isso significa API 36
        // (Android 16) — com 35 o upload é recusado na validação da versão.
        // Confirmar a exigência vigente no Play Console: essa régua se move.
        targetSdkVersion = 36
        ndkVersion = "26.1.10909125"
        // Kotlin fica em 1.9.x: o react-native-gradle-plugin do RN 0.76 foi
        // compilado contra ele e quebra com KGP 2.x
        // ("Found interface KotlinTopLevelExtension, but class was expected").
        // Por isso o AsyncStorage está fixado na série 2.x — a 3.x exige
        // Kotlin >= 2.1 (ver docs/mobile-hardening.md).
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Sem versão: quem manda é o react-native-gradle-plugin (RN 0.76 → 1.9.x).
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
