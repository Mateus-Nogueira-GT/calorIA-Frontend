<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF6B35" />
    <style>
      @font-face { font-family: 'Inter'; src: url('/fonts/Inter-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Inter-Medium'; src: url('/fonts/Inter-Medium.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      @font-face { font-family: 'Inter-SemiBold'; src: url('/fonts/Inter-SemiBold.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      @font-face { font-family: 'Inter-Bold'; src: url('/fonts/Inter-Bold.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      @font-face { font-family: 'Inter-ExtraBold'; src: url('/fonts/Inter-ExtraBold.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      :focus-visible { outline: 2px solid #1B2D5B; outline-offset: 3px; }
      body { background: #FAF8F4; }
    </style>
    <title>calorIA</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root,
      #root > div {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      #root {
        display: flex;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
