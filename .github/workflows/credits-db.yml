name: Créditos (PostgreSQL)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  credits:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caloria_credits_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Carteira, concorrência, grants e convites em banco descartável
        run: npx vitest run src/modules/credits/credits.integration.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/caloria_credits_test
      # Rodam em passos separados: os dois recriam os schemas do mesmo banco.
      - name: Painel admin (métricas, usuários, convites) em banco descartável
        run: npx vitest run src/modules/admin/admin.integration.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/caloria_credits_test
